name: Embedded Sensor CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Show tool versions
        run: |
          gcc --version
          python --version
          make --version

      - name: Build simulator
        run: make

      - name: Run unit tests
        run: make test

      - name: Generate test report
        if: always()
        run: make report

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sensor-test-report
          path: reports/test_report.txt